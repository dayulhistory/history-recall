<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2747a8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="역사 인출">
<title>역사 백지 인출 학습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 주제 선택 + 탭 4개, 본문은 공책 한 장처럼 읽히는 단일 컬럼(최대 880px) */
:root{
  --paper:#f4f6f9; --sheet:#ffffff; --ink:#18202e; --muted:#5f6b7d; --line:#d9dfe8;
  --accent:#2747a8; --accent-soft:#e6ebf8; --marker:#ffe680;
  --good:#1d7a4f; --good-soft:#e2f4ea; --bad:#b4342b; --bad-soft:#fbe6e4;
  --f-display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151c; --sheet:#1a2029; --ink:#e7ebf2; --muted:#9aa6b8; --line:#2d3644;
  --accent:#8ea8ff; --accent-soft:#232d48; --marker:#6b5a12;
  --good:#5fcf98; --good-soft:#173527; --bad:#ff8a80; --bad-soft:#3d1f1d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#11151c; --sheet:#1a2029; --ink:#e7ebf2; --muted:#9aa6b8; --line:#2d3644;
  --accent:#8ea8ff; --accent-soft:#232d48; --marker:#6b5a12;
  --good:#5fcf98; --good-soft:#173527; --bad:#ff8a80; --bad-soft:#3d1f1d; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 64px}
header h1{font-family:var(--f-display);font-size:1.6rem;margin:4px 0 2px;text-wrap:balance;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.92rem}
nav.tabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:2px solid var(--line);overflow-x:auto}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:700;font-family:var(--f-display);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
nav.tabs a.on{color:var(--accent);border-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lab{font-size:.85rem;color:var(--muted);font-weight:700}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:6px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff}
:root[data-theme="dark"] button{color:#0f1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#0f1420}}
button.ghost{background:transparent;color:var(--accent)}
button.small{padding:4px 10px;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);color:var(--ink);font-weight:500;padding:5px 10px;border-radius:99px;font-size:.88rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip .n{font-family:var(--f-display);font-variant-numeric:tabular-nums;margin-right:4px}
h2{font-family:var(--f-display);font-size:1.25rem;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-size:1.02rem;margin:18px 0 6px;color:var(--accent)}
.q{background:var(--accent-soft);border-left:4px solid var(--accent);padding:8px 12px;border-radius:4px;margin:10px 0}
.hint{color:var(--muted);font-size:.9rem}
textarea.blank{width:100%;min-height:340px;line-height:2em;background-image:repeating-linear-gradient(transparent 0 calc(2em - 1px),var(--line) calc(2em - 1px) 2em);background-attachment:local;padding:4px 12px}
.kw{display:inline-block;padding:2px 9px;margin:3px;border-radius:99px;font-size:.88rem;font-weight:500}
.kw.ok{background:var(--good-soft);color:var(--good)}
.kw.no{background:var(--bad-soft);color:var(--bad);font-weight:700}
.kw.hint{background:var(--paper);color:var(--muted);border:1px dashed var(--line);font-family:var(--f-display);letter-spacing:.08em}
.score{font-family:var(--f-display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
mark{background:var(--marker);color:inherit;padding:0 2px;border-radius:2px}
.sent{margin:8px 0;line-height:2.2}
.sent .num{font-family:var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px;font-size:.85rem}
input.fill{border:none;border-bottom:2px solid var(--accent);border-radius:0;padding:0 4px;background:var(--accent-soft);min-width:4em;text-align:center;font-weight:700}
input.fill.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
input.fill.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.ans{font-size:.8rem;color:var(--good);font-weight:700;margin-left:2px}
.bank{border:1px dashed var(--line);border-radius:8px;padding:8px;margin:10px 0}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:3px solid var(--accent);display:grid;gap:10px}
.tl li{position:relative;display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}
.tl li::before{content:"";position:absolute;left:-30px;top:12px;width:13px;height:13px;border-radius:50%;background:var(--sheet);border:3px solid var(--accent)}
.tl .yr{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.tl input{width:100%}
.tl .tg{font-size:.75rem;color:var(--muted)}
.ord{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.ord li{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.ord li .t{flex:1}
.ord li.ok{border-color:var(--good);background:var(--good-soft)}
.ord li.no{border-color:var(--bad);background:var(--bad-soft)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}
th{color:var(--muted);font-size:.8rem}
td.n{font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.tablebox{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.8rem;font-weight:700}
.pill.g{background:var(--good-soft);color:var(--good)} .pill.b{background:var(--bad-soft);color:var(--bad)} .pill.m{background:var(--paper);color:var(--muted)}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:22px;vertical-align:middle}
.spark i{width:6px;background:var(--accent);border-radius:1px;opacity:.85}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--sheet);border-radius:10px;padding:20px;max-width:380px}
.steps{margin:0;padding-left:20px}
.steps li{margin:6px 0}
.timer{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
@media (max-width:520px){.tl li{grid-template-columns:1fr}.score{font-size:2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>역사 백지 인출 학습장</h1>
  <p>시험범위 주제 16, 24~34 · 매번 빈칸과 문제 순서가 새로 바뀌니 여러 번 반복해 보세요. 기록은 이 기기의 브라우저에만 저장됩니다.</p>
</header>
<nav class="tabs" id="tabs">
  <a href="#recall" data-v="recall">① 백지 인출</a>
  <a href="#blank" data-v="blank">② 빈칸 채우기</a>
  <a href="#timeline" data-v="timeline">③ 백지 연표</a>
  <a href="#record" data-v="record">④ 회독 기록</a>
  <a href="#guide" data-v="guide">사용법</a>
</nav>
<main id="view"></main>
</div>
<div class="modal" id="modal"><div class="box"><p id="modalMsg"></p><div class="row" style="justify-content:flex-end"><button class="ghost" id="mNo">취소</button><button id="mYes">확인</button></div></div></div>

<script>
const DATA = {"topics": [{"no": 16, "title": "십자군 전쟁과 그 영향", "page": "90~92쪽", "unit": "Ⅱ. 세계 종교의 확산과 지역 문화의 발전", "q": "십자군 전쟁은 크리스트교 세계와 이슬람 세계에 각각 어떤 영향을 끼쳤을까?", "sections": [{"h": "십자군 전쟁의 전개", "s": ["로마 교황은 이슬람 세력에게서 성지 [[예루살렘]]을 되찾자고 서유럽인들에게 호소했다([[1095]]).", "[[셀주크 튀르크]]의 압박에 고전하던 [[비잔티움 제국]]이 교황에게 지원을 청한 것이 계기가 되었다.", "십자군 전쟁은 종교적 열정뿐 아니라 교황(권력 확대), 왕과 제후(영토), 상인(동방 무역 이익), [[농민]](장원에서 벗어날 기회) 등 각 계층의 현실적 이익을 추구한 전쟁이었다.", "[[제1차 십자군]]은 예루살렘을 되찾았지만 곧 이슬람 세력이 반격했고, 이후 200년간 여러 차례 십자군이 조직됐지만 끝내 예루살렘 탈환에 실패했다.", "[[제4차 십자군]] 때는 같은 크리스트교 국가인 비잔티움 제국의 수도 [[콘스탄티노폴리스]]를 점령해 약탈했다.", "예루살렘은 유대교의 [[통곡의 벽]], 크리스트교의 성묘 교회, 이슬람교의 [[바위 돔]]이 있어 세 종교 모두의 성지이다."]}, {"h": "지중해 무역권의 발달", "s": ["전쟁 중에 상인들이 오가며 지중해 무역이 발달해 [[베네치아]], [[제노바]] 등 이탈리아 도시가 번성했다.", "북유럽의 상업 도시들은 [[한자 동맹]]을 맺어 서로 협력했다.", "이슬람 세계가 보전한 그리스·로마 문화가 서유럽에 다시 알려지면서 이탈리아에서 [[르네상스]]가 일어났다."]}, {"h": "중세 도시의 성장과 장원의 해체", "s": ["상공업자들은 영주의 지배에서 벗어나기 위해 [[자치권]]을 돈으로 사거나 힘으로 획득했고, [[시의회]]를 구성해 도시를 스스로 다스렸다.", "영주가 도시에 자치권을 인정해 준 증서를 [[특허장]]이라 하고, 성벽(부르그) 안에 사는 상공업자를 [[부르주아]]라고 불렀다.", "14세기 중엽부터 [[흑사병]]이 유행해 노동력이 부족해지자 영주의 지배력은 약해지고 [[농노]]의 지위는 향상됐다.", "그 결과 [[장원]]은 점점 해체됐고, 서유럽의 [[봉건 사회]]도 저물어 갔다."]}, {"h": "교황권의 약화와 왕권의 강화", "s": ["예루살렘 탈환 실패로 교황의 권위는 추락했고, 흑사병은 이런 경향을 더욱 부추겼다.", "14세기 초 프랑스 왕은 교황을 체포하고 교황청을 로마에서 프랑스의 [[아비뇽]]으로 옮겨 자신의 통제 아래 두었다.", "영국과 프랑스는 왕위 계승 문제와 영토 문제로 [[백년 전쟁]]([[1337]]~1453)을 벌였고, [[잔 다르크]]의 활약으로 프랑스가 승리했다.", "화약 무기의 보급으로 [[기사]]의 중요성이 떨어지고, 세금과 군사 동원 권한이 [[왕]]에게 집중됐다."]}, {"h": "십자군 전쟁 이후 이슬람 세계의 변화", "s": ["술탄 [[살라흐 앗딘]]은 12세기 말 십자군으로부터 예루살렘을 되찾았다.", "13세기에 [[칭기즈 칸]]의 몽골군이 침입했고, 1258년에 아바스 왕조의 수도 [[바그다드]]를 점령했다.", "이슬람 상인들은 [[몽골 제국]]의 안정된 동서 교역망을 통해 무역 활동에 나섰고, 이슬람 세계는 더 넓어졌다."]}]}, {"no": 24, "title": "유럽의 종교 개혁", "page": "124~125쪽", "unit": "Ⅲ. 지역 세계의 교류와 변화", "q": "종교 개혁 이후 구교와 신교의 대립은 유럽 역사에 어떤 영향을 미쳤을까?", "sections": [{"h": "종교 개혁과 신교의 등장", "s": ["교황은 [[성 베드로 성당]] 증축 자금을 마련하기 위해 [[면벌부]]를 대대적으로 판매했다.", "독일의 [[루터]]는 「[[95개조 반박문]]」을 발표해 교회의 면벌부 판매를 비판했다([[1517]]).", "루터는 구원은 오직 [[신앙]]과 은총으로만 가능하며, 신앙의 유일한 근거는 『[[성경]]』이라고 주장했다.", "루터의 주장은 [[인쇄술]]의 발달에 힘입어 빠르게 퍼졌고, 그는 『성경』을 [[독일어]]로 번역했다.", "[[아우크스부르크 화의]]([[1555]])에서 각 제후의 결정으로 [[루터파]]가 공식 인정됐다."]}, {"h": "신교의 확산과 종교 전쟁", "s": ["제네바에서는 [[칼뱅]]이 [[예정설]]을 주장했고, 직업에 성실하라는 그의 주장은 도시 [[상공업자]]들의 지지를 받았다.", "영국에서는 국왕 [[헨리 8세]]가 스스로 교회의 수장이 되어 [[영국 국교회]]를 수립했다.", "크리스트교 세계는 [[구교]](로마 가톨릭교)와 [[신교]](루터파, 칼뱅파)로 나뉘어 대립했다.", "독일에서 일어난 [[30년 전쟁]]은 국제 전쟁으로 확대됐고, [[베스트팔렌 조약]]([[1648]])으로 마무리되어 [[칼뱅파]]도 공식 인정받았다.", "가톨릭교회는 [[예수회]]를 조직해 선교 활동에 나섰고, 금서 목록을 작성하고 [[종교 재판소]]를 설립했다.", "16세기 종교 갈등과 흉작 속에서 [[마녀사냥]]이 벌어졌고, 주된 공격 대상은 [[여성]]이었다."]}]}, {"no": 25, "title": "신항로 개척과 아메리카 대륙의 변화", "page": "126~129쪽", "unit": "Ⅲ. 지역 세계의 교류와 변화", "q": "유럽의 신항로 개척 이후 아메리카에 어떤 변화가 나타났을까?", "sections": [{"h": "유럽의 신항로 개척", "s": ["아시아의 [[향신료]], 면직물, 비단 등은 이슬람 상인과 이탈리아 상인을 거쳐 판매돼 가격이 비쌌다.", "마르코 폴로의 『[[동방견문록]]』은 유럽인의 호기심을 더욱 부추겼다.", "지중해 무역의 혜택을 거의 보지 못했던 [[포르투갈]]과 [[에스파냐]]가 신항로 개척에 앞장섰다.", "[[바르톨로메우 디아스]]는 아프리카 남쪽 끝 [[희망봉]]에 도착했다([[1488]]).", "[[콜럼버스]]는 에스파냐의 후원을 받아 대서양을 건너 인도에 가려 했으나 아메리카에 도착했다([[1492]]).", "[[바스쿠 다가마]]는 아프리카를 돌아 인도로 가는 항로를 발견했다([[1498]]).", "[[마젤란]] 일행은 세계 일주 항해에 성공했다(1519~1522).", "아랍의 조선 기술을 받아들인 [[카라벨선]], 나침반, 아스트롤라베 등이 원거리 항해를 가능하게 했다."]}, {"h": "아메리카 대륙의 변화", "s": ["유럽인이 도착하기 전 아메리카에는 [[아스테카 제국]]과 [[잉카 제국]]이 번영하고 있었다.", "에스파냐는 말과 총 등을 동원해 아메리카의 제국을 정복했고, 뒤이어 들어온 유럽 국가들도 원주민을 몰아내고 식민지를 건설했다.", "유럽인은 금·은 광산을 개발하고, 사탕수수·담배 등을 대량 재배하는 [[플랜테이션]] 농장을 만들었으며, 대규모 [[목축]]도 시작했다.", "이 과정에서 원주민은 삶의 터전을 잃었고, 숲이 대량으로 파괴됐다.", "원주민은 광산과 대농장에서 가혹한 노동에 시달리고 유럽에서 전해진 [[전염병]]에 고통받아 인구가 크게 줄었다.", "원주민 인구가 줄자 유럽인은 [[아프리카인]]을 아메리카로 데려와 노예로 삼았다.", "미국 정부는 2021년부터 ‘콜럼버스의 날’을 ‘[[원주민의 날]]’로 선포했다."]}]}, {"no": 26, "title": "세계적인 교역망의 형성", "page": "130~131쪽", "unit": "Ⅲ. 지역 세계의 교류와 변화", "q": "신항로 개척 이후 각 지역 교역망은 어떻게 세계 교역망으로 확대됐을까?", "sections": [{"h": "유럽의 상업 혁명", "s": ["신항로 개척 이후 대서양을 중심으로 유럽, 아프리카, 아메리카를 잇는 [[삼각 무역]]이 전개됐다.", "유럽인은 총기·직물을 아프리카에서 [[흑인 노예]]와 교환해 아메리카에 팔고, 담배·[[설탕]]을 사서 유럽으로 돌아왔다.", "아메리카가 원산지인 [[감자]], [[옥수수]], 고추 등이 유럽에 전해졌다.", "아메리카의 금은이 유럽으로 들어와 물가가 크게 오르자 상공업과 무역에 투자하려는 경향이 커졌다([[상업 혁명]]).", "투자 규모가 커지면서 [[주식회사]]가 등장했고, [[어음]]과 [[보험]] 등의 금융 제도도 갖춰졌다.", "최초의 주식회사는 [[1602]]년에 세워진 [[네덜란드 동인도 회사]]로, 주식 거래를 위해 [[증권 거래소]]도 생겼다."]}, {"h": "교역망의 세계적 확대", "s": ["네덜란드, 영국 등은 무역 독점권과 군대, 조약 체결 권한을 가진 [[동인도 회사]]를 만들어 아시아 교역망에 참여했다.", "유럽은 아메리카에서 들여온 [[은]]으로 인도산 [[면직물]], 동남아시아산 향신료, 중국산 차·도자기·비단을 샀다.", "그 결과 교역망이 전 세계로 확대됐고, 특히 [[중국]]은 막대한 은을 보유하게 됐다.", "[[일본]]은 유럽과 교류하며 [[조총]]과 크리스트교를 받아들였고, 17세기 일본의 은 생산량은 세계의 3분의 1에 달했다.", "[[믈라카]]는 동남아시아 해상 교역의 요지로, 16세기에는 포르투갈, 17세기부터는 [[네덜란드]]가 차지했다."]}]}, {"no": 27, "title": "재정과 군사를 독점한 국가들", "page": "132~133쪽", "unit": "Ⅲ. 지역 세계의 교류와 변화", "q": "유럽에 등장한 재정·군사 국가는 어떤 정책을 펼쳤을까?", "sections": [{"h": "재정·군사 국가의 등장", "s": ["봉건 질서가 쇠퇴하고 구교와 신교가 분열하면서 정부가 군사와 재정을 독점한 [[재정·군사 국가]]가 나타났다.", "재정·군사 국가는 국가 업무를 효율적으로 수행하는 [[관료제]]를 운용하고, 언제든지 동원할 수 있는 [[상비군]]을 두었다.", "이를 정당화하기 위해 왕의 권력이 신으로부터 주어졌다는 [[왕권신수설]]을 제시하는 국가도 있었다.", "상공업·무역에 종사하는 [[시민 계층]]을 보호하고 재정 지원을 받았으며, 상업을 중시하는 [[중상주의]] 정책을 시행했다.", "중상주의 국가는 수입을 억제하고 수출을 장려했으며, 수입품에 높은 [[관세]]를 부과하고 많은 양의 금과 은을 확보하려 했다.", "원료 공급지와 상품 시장을 얻기 위해 [[식민지]] 확보에 나섰고, 영국과 프랑스는 동인도 회사를 통해 아시아에 거점을 만들었다."]}, {"h": "유럽 각지의 재정·군사 국가", "s": ["[[영국]]은 왕과 의회가 타협해 의회 정치를 발전시켰고, [[프랑스]]는 의회를 무시하고 절대 왕권을 정당화했다.", "영국 의회에는 칼뱅파 신교도인 [[청교도]]가 많았고, 17세기에 왕을 처형하고 [[공화정]]을 수립하기도 했다.", "이후 의회는 전제 정치를 편 왕을 추방하고 새 왕을 추대해 [[입헌 군주정]]의 토대를 마련했다.", "프랑스에서는 ‘[[태양왕]]’을 자처한 [[루이 14세]]가 상비군과 관료제를 토대로 절대 권력을 누리고 [[베르사유 궁전]]을 지었다.", "동유럽은 [[농노제]]가 오래 유지되어 재정·군사 국가가 늦게 나타났고, 러시아와 [[프로이센]]에서는 [[계몽사상]]의 영향을 받은 군주들이 개혁을 추진했다."]}]}, {"no": 28, "title": "미국 혁명과 민주 공화국의 탄생", "page": "142~143쪽", "unit": "Ⅳ. 제국주의와 국민 국가 건설 운동", "q": "미국은 어떻게 성립했으며, 성립 후 어떤 나라로 발전했을까?", "sections": [{"h": "북아메리카 식민지와 영국의 갈등", "s": ["영국인들은 18세기 초까지 북아메리카 동부 해안에 [[13개]]의 식민지를 건설하고 자치를 누렸다.", "프랑스와의 전쟁으로 재정이 어려워진 영국은 설탕·차 등에 세금을 매기고, 신문·서적에 인지를 붙이게 하는 [[인지세법]]을 제정했다.", "식민지인들은 영국 의회에 식민지 [[대표]]가 참석하지 않았으므로 새 세금을 거둘 수 없다며 반발했다.", "일부 식민지인들이 영국 선박의 차 상자를 바다에 던진 [[보스턴 차 사건]]이 일어났다([[1773]])."]}, {"h": "미국 혁명의 전개", "s": ["영국이 보스턴 항구를 폐쇄하자 식민지 대표들은 [[대륙 회의]]를 열고 영국에 항의했다.", "영국군과 식민지 [[민병대]]의 무력 충돌로 독립 전쟁이 시작됐고, [[워싱턴]]이 총사령관이 되었다.", "식민지 대표들은 「[[독립 선언문]]」을 발표해([[1776]]) 생명, 자유, [[행복 추구]]의 권리와 민주주의 원칙을 밝혔다.", "[[프랑스]], 에스파냐 등의 지원으로 전세가 역전되어 식민지는 독립을 인정받았다([[1783]])."]}, {"h": "민주 공화국 미국의 수립", "s": ["독립 후 제정된 헌법은 [[연방주의]], [[공화주의]], [[삼권 분립]]에 기초를 두었다.", "워싱턴이 초대 대통령에 오르며 민주 공화국인 [[아메리카 합중국]](미국)이 탄생했다.", "미국 혁명은 [[프랑스 혁명]]과 라틴 아메리카 독립운동에 큰 영향을 미쳤다.", "다만 대농장주와 해운업자들의 반대로 「독립 선언문」에 [[노예제]] 폐지는 포함되지 않았다(한계)."]}]}, {"no": 29, "title": "프랑스 혁명의 발발과 전파", "page": "144~149쪽", "unit": "Ⅳ. 제국주의와 국민 국가 건설 운동", "q": "시민 혁명의 대표적 사례인 프랑스 혁명은 이후 역사에 어떤 영향을 미쳤을까?", "sections": [{"h": "혁명 전 프랑스 사회의 모순", "s": ["인구의 2% 정도인 [[성직자]](제1 신분)와 [[귀족]](제2 신분)은 국토의 약 40%를 소유하고 세금 면제의 특권을 누렸다.", "[[평민]](제3 신분) 중 부유해진 [[시민 계급]]은 계몽사상과 미국 혁명의 영향을 받아 자유롭고 평등한 사회를 꿈꿨다."]}, {"h": "프랑스 혁명의 전개", "s": ["재정이 파산 상황에 이르자 국왕 [[루이 16세]]는 세금 확보를 위해 [[삼부회]]를 소집했다(1789).", "평민 대표는 머릿수 투표를 주장하다 별도로 의회를 결성하고 해산하지 않겠다고 선언했다([[테니스코트의 선언]]).", "분노한 파리 시민은 전제 정치의 상징인 [[바스티유 감옥]]을 습격했다(1789. 7.).", "의회는 [[봉건제]]를 폐지하고 「[[인간과 시민의 권리 선언|인권 선언|인권선언]]」을 발표했다.", "혁명의 확산을 걱정한 오스트리아와 [[프로이센]]이 위협하자 의회는 선전 포고를 하고 [[혁명전쟁]]에 들어갔다.", "파리 민중과 의용군은 왕정을 폐지하고 [[공화정]]을 선포했으며, 루이 16세를 처형했다(1793).", "급진파는 혁명에 반대하는 사람들을 탄압하는 [[공포 정치]]를 시행했다.", "[[나폴레옹]]이 쿠데타로 정권을 장악하면서([[1799]]) 프랑스 혁명은 사실상 끝을 맺었다."]}, {"h": "나폴레옹 전쟁과 혁명 이념의 전파", "s": ["나폴레옹은 국민 투표를 통해 [[황제]]의 자리에 올랐다([[1804]]).", "『[[나폴레옹 법전]]』에는 개인의 자유와 권리, 평등, 재산권이 반영되어 근대법 성립에 영향을 끼쳤다.", "프랑스 혁명 시기 도량형을 통일한 [[미터법]]이 만들어졌다.", "나폴레옹은 영국을 고립시키려 [[대륙 봉쇄령]]을 내렸고, 이를 어긴 [[러시아]] 원정에 실패해 몰락했다.", "나폴레옹 전쟁 이후 자유와 평등의 이념이 퍼지고, 민족의 독립과 통일을 추구하는 [[민족주의]]가 성장했다."]}, {"h": "프랑스 혁명에 자극받은 아이티", "s": ["프랑스 식민지 [[아이티]]의 흑인 노예들은 노예제를 폐지하고 독립 투쟁에 나섰다.", "[[투생 루베르튀르]]가 독립 투쟁을 이끌었고, 아이티는 1804년 라틴 아메리카의 첫 독립 국가가 됐다.", "영국에서는 [[1807]]년 노예 무역 폐지, 1833년 노예제 폐지가 결정됐다."]}]}, {"no": 30, "title": "빈 체제와 1848년 혁명", "page": "150~153쪽", "unit": "Ⅳ. 제국주의와 국민 국가 건설 운동", "q": "나폴레옹의 몰락 이후 등장한 빈 체제는 무엇이고, 어떻게 무너졌을까?", "sections": [{"h": "보수적인 빈 체제의 성립", "s": ["나폴레옹 몰락 후 유럽 대표들은 [[빈 회의]](1814~1815)를 열어 혁명 이전 상태로 되돌리기로 합의했다.", "빈 회의는 오스트리아의 외무 장관 [[메테르니히]]가 주도했다.", "빈 체제는 [[자유주의]]와 [[민족주의]] 운동을 탄압했다.", "오스만 제국의 지배를 받던 [[그리스]]는 독립 전쟁(1821)을 일으켜 1830년에 독립을 승인받았고, 빈 체제에 금이 가기 시작했다."]}, {"h": "프랑스의 자유주의 혁명", "s": ["파리 시민과 자유주의자들은 [[7월 혁명]]([[1830]])을 일으켜 [[루이 필리프]]를 ‘시민의 왕’으로 추대했다.", "들라크루아는 7월 혁명을 기념해 「[[민중을 이끄는 자유의 여신]]」을 그렸다.", "중하층 시민, 노동자, 공화주의자가 합세해 [[2월 혁명]]([[1848]])을 일으켜 다시 공화정을 수립했다.", "프랑스 삼색기의 파란색, 흰색, 붉은색은 각각 자유, [[평등]], 우애를 상징한다."]}, {"h": "유럽의 1848년 혁명", "s": ["2월 혁명은 독일, 오스트리아, 헝가리, 이탈리아 등에 영향을 주어 [[1848년 혁명]]으로 발전했다.", "각지에서 국민 주권과 기본권에 기초한 [[국민 국가]]를 수립하려는 움직임이 활발해졌다.", "1848년 혁명으로 빈 체제를 상징하는 메테르니히가 몰락했다."]}, {"h": "영국의 개혁과 선거권 확대", "s": ["영국 의회는 1832년 [[개혁법]](제1차 선거법 개정)을 통과시켜 도시의 [[상공업자]]가 선거권을 얻었다.", "선거권을 얻지 못한 노동자들은 「[[인민헌장]]」을 발표하고 [[차티스트 운동]]을 벌였다.", "「인민헌장」은 21세 이상 모든 남성의 투표권, [[비밀 투표]], 의원 재산 자격 폐지 등을 요구했다.", "영국은 선거법 개정을 거듭해 1928년 제5차 개정으로 [[21세 이상의 남녀]]에게 선거권을 주었다."]}]}, {"no": 31, "title": "새롭게 등장한 국민 국가", "page": "154~155쪽", "unit": "Ⅳ. 제국주의와 국민 국가 건설 운동", "q": "분열되어 있던 이탈리아와 독일은 어떻게 국민 국가로 발전했을까?", "sections": [{"h": "통일된 이탈리아 왕국의 탄생", "s": ["[[마치니]]와 가리발디 등은 1848년 혁명의 영향으로 통일 운동을 전개했지만 실패했다.", "[[사르데냐 왕국]]의 총리 [[카부르]]는 산업을 일으키고 프랑스와 동맹을 맺어 [[오스트리아]]에 맞서 중북부 이탈리아를 통합했다.", "[[가리발디]]는 [[시칠리아]]와 이탈리아 남부를 차지했다.", "남북이 통합되어 [[이탈리아 왕국]]이 탄생했고([[1861]]), 이후 베네치아와 로마 교황령까지 통합했다.", "1907년 [[신채호]]는 통일의 주역을 소개한 『이태리 건국 삼걸전』을 번역했다.", "통일 후에도 상공업이 발달한 북부와 농업 중심의 남부 사이 [[경제 격차]]로 갈등이 이어졌다."]}, {"h": "통일된 독일 제국의 수립", "s": ["북부의 [[프로이센]]은 동맹국 간 [[관세]]를 폐지해 경제적 통합을 먼저 이루었다.", "프로이센 총리 [[비스마르크]]는 ‘철과 피’로만 통일을 이룰 수 있다며 군사력을 키웠다([[철혈 정책]]).", "프로이센은 오스트리아를 몰아내고 북독일을 통일한 뒤, [[프랑스]]를 공격해 승리했다.", "프로이센의 [[빌헬름 1세]]가 베르사유 궁전에서 황제로 즉위해 [[독일 제국]]이 수립됐다([[1871]]).", "[[그림 형제]]는 독일 각지의 민담과 전설을 모아 책을 펴내 독일인의 민족의식을 키우는 데 기여했다."]}]}, {"no": 32, "title": "미국의 성장과 독립을 이룬 라틴 아메리카", "page": "156~158쪽", "unit": "Ⅳ. 제국주의와 국민 국가 건설 운동", "q": "미국의 남북 전쟁은 왜 일어났고, 이후 미국은 어떻게 변화했을까?", "sections": [{"h": "남북 전쟁과 미국의 산업화", "s": ["미국은 독립 이후 [[서부 개척]]과 영토 매입(루이지애나, 알래스카 등)으로 영토를 확장했다.", "[[남부]]는 흑인 노예를 이용한 면화·담배 대농장이 발달해 노예제 유지를 원했다.", "[[북부]]는 상공업이 발달해 노예제 확대를 반대했다.", "노예제 확대를 반대하는 [[링컨]]이 대통령에 당선되자 남부의 여러 주가 연방을 탈퇴했다.", "그 결과 [[남북 전쟁]]([[1861]]~1865)이 일어났고, 링컨은 전쟁 중 [[노예 해방]]을 선언했으며 [[북부]]가 승리했다.", "이후 [[대륙 횡단 철도]]가 완성되고 [[이민자]]가 늘어 미국은 신흥 공업 대국으로 성장했다."]}, {"h": "라틴 아메리카 여러 나라의 독립", "s": ["[[나폴레옹 전쟁]]으로 유럽 왕실이 위기에 처하자 라틴 아메리카에서 독립운동이 전개됐다.", "독립운동은 식민지에서 태어난 백인인 [[크리오요]]가 주도했다.", "[[이달고]] 신부는 멕시코 독립운동을 전개했다(1810).", "[[볼리바르]]는 콜롬비아, 베네수엘라, 에콰도르를 해방했고, [[산마르틴]]은 아르헨티나, 칠레, 페루의 해방을 위해 노력했다.", "메테르니히는 간섭하려 했으나 [[영국]]은 상품 시장 확대를 위해 반대했고, 미국은 [[먼로 선언]]을 발표했다.", "독립 후에는 크리오요가 부와 권력을 독점하고 미국과 영국이 각종 [[이권]]을 차지했다."]}]}, {"no": 33, "title": "산업화와 사회 변화", "page": "160~163쪽", "unit": "Ⅳ. 제국주의와 국민 국가 건설 운동", "q": "기계를 이용해 상품을 대량으로 생산하는 산업 혁명이 일어나면서 사회는 어떻게 변화했을까?", "sections": [{"h": "영국에서 시작된 산업 혁명", "s": ["영국에서는 인도산 [[면직물]]의 수요가 커지면서 국내 면직물 공업이 발달했다.", "18세기 후반 영국에서 면직물 공업의 [[기계화]]를 중심으로 [[산업 혁명]]이 시작됐다.", "영국은 [[식민지]]를 원료 공급지와 상품 판매처로 활용해 많은 [[자본]]을 축적했다.", "[[인클로저]](울타리 치기)로 농촌을 떠난 농민들이 도시로 모여 노동력이 풍부했다."]}, {"h": "생산 기술의 혁신과 교통 혁명", "s": ["실을 뽑는 [[방적기]]와 천을 짜는 [[방직기]]가 발명됐다.", "[[제임스 와트]]가 개량한 [[증기 기관]]이 새로운 동력으로 쓰이면서 면직물 생산이 빠르게 늘었다.", "수공업 중심의 생산 방식은 [[공장제 기계 공업]]으로 바뀌어 갔다.", "[[증기 기관차]]로 전국이 철도망으로 연결됐고, [[증기선]]이 범선을 대신했다(교통 혁명)."]}, {"h": "자본주의 경제 체제의 성립", "s": ["[[자본가]]가 이윤을 목적으로 [[노동자]]를 고용해 상품을 생산하는 [[자본주의]] 경제 체제가 자리 잡았다.", "대규모 공장 지역으로 인구가 집중되며 [[도시화]]가 빠르게 진행됐다.", "산업 혁명은 19세기에 유럽과 미국으로 확산했고, 19세기 말에는 러시아와 일본도 산업화를 추진했다."]}, {"h": "사회·환경 문제와 사회주의 사상의 등장", "s": ["산업 혁명 이후 [[빈부 격차]]가 커지고, 노동자는 장시간 노동과 저임금에 시달렸으며 [[아동]]도 일터로 내몰렸다.", "도시에는 주택과 상하수도 등 위생 시설이 부족했고, 공장의 매연으로 [[대기 오염]] 같은 공해 문제가 생겼다.", "[[마르크스]]와 [[엥겔스]]는 노동자가 주인이 되는 사회를 건설해야 한다며 [[사회주의]] 사상을 주장했다."]}]}, {"no": 34, "title": "서양 열강의 제국주의화", "page": "164~165쪽", "unit": "Ⅳ. 제국주의와 국민 국가 건설 운동", "q": "산업 혁명 이후 열강이 아프리카, 아시아 등을 식민지로 삼은 까닭은 무엇일까?", "sections": [{"h": "제국주의의 등장", "s": ["19세기 후반 소수의 [[거대 기업]]이 시장을 독점했고, [[석유]]와 [[전기]]가 동력으로 활용됐으며 화학·철강 산업이 발달했다.", "서양 열강은 값싼 [[원료]], 상품 판매 [[시장]], 자본 [[투자]]처를 확보하고자 했다.", "군사력을 앞세워 아프리카와 아시아를 식민지로 삼은 대외 팽창 정책을 [[제국주의]]라고 한다.", "제국주의 국가는 인종 간에 우열이 있다는 [[인종주의]]를 내세웠다.", "진화론을 왜곡해 우수한 사회만 살아남는다고 주장한 [[사회 진화론]]으로 침략을 정당화했다."]}, {"h": "제국주의 열강의 세계 분할", "s": ["[[베를린 회의]](1884~1885)에서 열강은 특정 지역을 먼저 개척한 국가가 지배하기로 하는 등 아프리카 분할 원칙을 논의했다.", "카이로와 케이프타운을 잇는 영국의 [[종단 정책]]과 아프리카를 동서로 잇는 프랑스의 [[횡단 정책]]이 충돌했다.", "영국과 프랑스는 [[파쇼다 사건]]([[1898]])으로 충돌했다.", "영국은 미얀마, 싱가포르, 말레이시아로, [[프랑스]]는 인도차이나반도로, [[네덜란드]]는 인도네시아로 세력을 넓혔다.", "열강은 동남아시아 식민지에서 차, 커피, 사탕수수, 고무 등을 생산하는 [[플랜테이션]] 농장을 경영했다.", "나미비아의 [[헤레로인]]은 1904년 독일의 지배에 맞서 봉기했으나 학살당했다."]}]}], "timeline": [{"y": 1095, "label": "1095", "ev": "교황, 예루살렘 탈환을 위한 십자군 호소", "key": ["십자군"], "t": 16}, {"y": 1096, "label": "1096~1099", "ev": "제1차 십자군, 예루살렘 탈환", "key": ["제1차십자군", "1차십자군"], "t": 16}, {"y": 1190, "label": "12세기 말", "ev": "살라흐 앗딘, 예루살렘 되찾음", "key": ["살라흐앗딘"], "t": 16, "approx": true}, {"y": 1202, "label": "1202~1204", "ev": "제4차 십자군, 콘스탄티노폴리스 약탈", "key": ["제4차십자군", "4차십자군", "콘스탄티노폴리스"], "t": 16}, {"y": 1258, "label": "1258", "ev": "몽골군, 바그다드 점령", "key": ["바그다드"], "t": 16}, {"y": 1309, "label": "14세기 초", "ev": "교황청, 로마에서 아비뇽으로 옮겨짐", "key": ["아비뇽"], "t": 16, "approx": true}, {"y": 1337, "label": "1337~1453", "ev": "백년 전쟁 (영국 vs 프랑스)", "key": ["백년전쟁"], "t": 16}, {"y": 1347, "label": "14세기 중엽", "ev": "흑사병 유행 → 장원 해체", "key": ["흑사병"], "t": 16, "approx": true}, {"y": 1488, "label": "1488", "ev": "바르톨로메우 디아스, 희망봉 도착", "key": ["디아스", "희망봉"], "t": 25}, {"y": 1492, "label": "1492", "ev": "콜럼버스, 아메리카 도착", "key": ["콜럼버스"], "t": 25}, {"y": 1498, "label": "1498", "ev": "바스쿠 다가마, 인도 항로 개척", "key": ["다가마"], "t": 25}, {"y": 1517, "label": "1517", "ev": "루터, 「95개조 반박문」 발표", "key": ["95개조", "루터"], "t": 24}, {"y": 1519, "label": "1519~1522", "ev": "마젤란 일행, 세계 일주", "key": ["마젤란"], "t": 25}, {"y": 1555, "label": "1555", "ev": "아우크스부르크 화의 (루터파 인정)", "key": ["아우크스부르크"], "t": 24}, {"y": 1602, "label" const T = DATA.topics, TL = DATA.timeline;
const byNo = n => T.find(t=>t.no===n);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase().replace(/[\s·・,.「」『』'"‘’“”()\-~]/g,"");
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const today = () => {const d=new Date();return `${d.getMonth()+1}/${d.getDate()}`;};

/* ---------- 저장 ---------- */
const KEY="history-recall-v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}
function save(rec){try{const h=load();h.push(Object.assign({d:today(),ts:Date.now()},rec));localStorage.setItem(KEY,JSON.stringify(h.slice(-800)))}catch(e){}}
function clearAll(){try{localStorage.removeItem(KEY)}catch(e){}}
let UI={};try{UI=JSON.parse(localStorage.getItem("ui-recall-v1"))||{}}catch(e){}
function saveUI(){try{localStorage.setItem("ui-recall-v1",JSON.stringify(UI))}catch(e){}}

/* ---------- 데이터 가공 ---------- */
const BL = /\[\[(.+?)\]\]/g;
function parse(sent){ // -> parts: string | {ans:[...]}
  const out=[];let last=0;let m;BL.lastIndex=0;
  while((m=BL.exec(sent))){out.push(sent.slice(last,m.index));out.push({ans:m[1].split("|")});last=BL.lastIndex;}
  out.push(sent.slice(last));return out;
}
const plain = s => s.replace(BL,(_,a)=>a.split("|")[0]);
const marked = s => esc(s).replace(/\[\[(.+?)\]\]/g,(_,a)=>`<mark>${esc(a.split("|")[0])}</mark>`);
const STOP=new Set(["왕","은","대표","13개"]);
function keywords(t){ // 섹션별 키워드
  return t.sections.map(sec=>{
    const ks=[];sec.s.forEach(s=>{let m;BL.lastIndex=0;while((m=BL.exec(s))){const a=m[1].split("|");if(/^\d+$/.test(a[0])||STOP.has(a[0]))continue;if(!ks.some(k=>k[0]===a[0]))ks.push(a);}});
    return {h:sec.h,ks};
  });
}
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const chosung = s => [...s].map(c=>{const k=c.charCodeAt(0)-44032;return (k>=0&&k<11172)?CHO[Math.floor(k/588)]:c}).join("");

/* ---------- 공통 UI ---------- */
function topicSelect(id,val){return `<select id="${id}">${T.map(t=>`<option value="${t.no}" ${t.no==val?"selected":""}>주제 ${t.no}. ${esc(t.title)}</option>`).join("")}</select>`}
function topicChips(sel){return `<div class="chips" id="chips">${T.map(t=>`<button class="chip ${sel.includes(t.no)?"on":""}" data-no="${t.no}" aria-pressed="${sel.includes(t.no)}"><span class="n">${t.no}</span>${esc(t.title)}</button>`).join("")}</div>
<div class="row" style="margin-top:6px"><button class="ghost small" id="allOn">전체 선택</button><button class="ghost small" id="allOff">전체 해제</button></div>`}
function bindChips(key,rerender){
  document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{const n=+b.dataset.no;let s=UI[key]||[];s=s.includes(n)?s.filter(x=>x!==n):[...s,n];UI[key]=s;saveUI();rerender();});
  $("#allOn").onclick=()=>{UI[key]=T.map(t=>t.no);saveUI();rerender();};
  $("#allOff").onclick=()=>{UI[key]=[];saveUI();rerender();};
}
function ask(msg){return new Promise(r=>{$("#modalMsg").textContent=msg;$("#modal").classList.add("on");$("#mYes").onclick=()=>{$("#modal").classList.remove("on");r(true)};$("#mNo").onclick=()=>{$("#modal").classList.remove("on");r(false)};});}

let timerId=null,timerStart=0;
function viewRecall(){
  const no=UI.recallTopic||T[0].no, t=byNo(no), hint=UI.recallHint||0;
  const kws=keywords(t);
  const total=kws.reduce((a,s)=>a+s.ks.length,0);
  let hintHtml="";
  if(hint>=1){hintHtml=`<div class="hint" style="margin:8px 0">소제목: ${t.sections.map((s,i)=>`<b>${i+1}. ${esc(s.h)}</b>`).join(" · ")}</div>`;}
  if(hint>=2){hintHtml+=`<div>${kws.map(s=>s.ks.map(k=>`<span class="kw hint">${esc(chosung(k[0]))}</span>`).join("")).join("")}</div>`;}
  $("#view").innerHTML=`
  <section class="sheet">
    <div class="row"><span class="lab">주제</span>${topicSelect("rt",no)}

function startTimer(){timerStart=Date.now();timerId=setInterval(()=>{const s=Math.floor((Date.now()-timerStart)/1000);const el=$("#timer");if(el)el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");},1000);}
function stopTimer(){clearInterval(timerId);timerId=null;}
function gradeRecall(t,kws,text){
  const n=norm(text);let hit=0,total=0;const missed=[];
  const secHtml=kws.map(s=>{
    const items=s.ks.map(a=>{total++;const ok=a.some(x=>n.includes(norm(x)));if(ok)hit++;else missed.push(a[0]);return `<span class="kw ${ok?"ok":"no"}">${ok?"✓ ":""}${esc(a[0])}</span>`;}).join("");
    return `<h3>${esc(s.h)}</h3><div>${items}</div>`;}).join("");
  const pct=total?Math.round(hit/total*100):0;
  const secs=timerId?Math.floor((Date.now()-timerStart)/1000):0;stopTimer();
  save({m:"recall",t:t.no,s:pct,missed});
  const prev=load().filter(r=>r.m==="recall"&&r.t===t.no);
  const round=prev.length;
  $("#result").innerHTML=`<section class="sheet">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><div class="lab">${round}회차 인출 결과${secs?` · ${Math.floor(secs/60)}분 ${secs%60}초`:""}</div><div class="score">${pct}<small style="font-size:1rem">%</small></div><div class="hint">키워드 ${total}개 중 ${hit}개를 떠올렸어요.</div></div>
      <div style="min-width:180px;flex:1;max-width:320px"><div class="bar"><i style="width:${pct}%"></i></div><div class="hint" style="margin-top:4px">${pct>=90?"거의 완벽해요. 다음엔 힌트 없이 시간을 줄여 보세요.":pct>=60?"뼈대는 잡혔어요. 빨간 키워드를 중심으로 한 번 더!":"빨간 키워드가 들어간 문장을 읽고 다시 백지로 써 보세요."}</div></div>
    </div>
    <p class="hint" style="margin-top:12px">초록 = 떠올린 키워드, 빨강 = 빠뜨린 키워드. 띄어쓰기는 무시하고 확인합니다. 철자가 다르면 빠뜨린 것으로 나올 수 있어요.</p>
    ${secHtml}
    <h3>교과서 핵심 문장으로 확인하기</h3>
    <details><summary style="cursor:pointer;font-weight:700">펼쳐서 읽기 (빠뜨린 부분은 다시 백지로!)</summary>
    ${t.sections.map(s=>`<h3>${esc(s.h)}</h3>${s.s.map(x=>`<p class="sent" style="line-height:1.8">${marked(x)}</p>`).join("")}`).join("")}
    </details>
  </section>`;
  $("#result").scrollIntoView({behavior:"smooth",block:"start"});
}

let BLANK=null;
function viewBlank(){
  const sel=UI.blankTopics||[16];const lvl=UI.blankLvl||"mid";const bank=!!UI.blankBank;
  $("#view").innerHTML=`
  <section class="sheet">

    <div class="row" style="margin-top:12px"><span class="lab">난이도</span>
      <select id="lvl"><option value="easy">쉬움 · 문장마다 빈칸 1개</option><option value="mid">보통 · 키워드 절반</option><option value="hard">어려움 · 키워드 전부</option></select>

      <button id="gen">새 문제 만들기</button></div>
  </section><section id="bq"></section>`;
  $("#lvl").value=lvl;
  bindChips("blankTopics",viewBlank);
  $("#lvl").onchange=e=>{UI.blankLvl=e.target.value;saveUI();makeBlank();};
  $("#bank").onchange=e=>{UI.blankBank=e.target.checked;saveUI();renderBlank();};
  $("#gen").onclick=()=>makeBlank();
  if(BLANK&&JSON.stringify(BLANK.sel)===JSON.stringify(sel))renderBlank();else makeBlank();
}
function makeBlank(onlyWrong){
  const sel=UI.blankTopics||[16];const lvl=UI.blankLvl||"mid";
  let items=[];
  if(onlyWrong&&BLANK){items=BLANK.items.filter(it=>it.wrong).map(it=>({...it,wrong:false}));}
  else{
    T.filter(t=>sel.includes(t.no)).forEach(t=>t.sections.forEach(sec=>sec.s.forEach(s=>{
      const parts=parse(s);const idx=parts.map((p,i)=>typeof p==="object"?i:-1).filter(i=>i>=0);
      let pick;
      if(lvl==="easy")pick=shuffle(idx).slice(0,1);
      else if(lvl==="hard")pick=idx;
      else{pick=idx.filter(()=>Math.random()<.5);if(!pick.length)pick=shuffle(idx).slice(0,1);}
      items.push({t:t.no,h:sec.h,parts,pick:new Set(pick)});
    })));
  }
  BLANK={sel:sel.slice(),items,graded:false};renderBlank();
}
function renderBlank(){
  const box=$("#bq");if(!box)return;
  if(!BLANK.items.length){box.innerHTML=`<section class="sheet"><p class="hint">위에서 주제를 하나 이상 고르세요.</p></section>`;return;}
  let k=0;const words=[];
  let html="",lastT=null,lastH=null,num=0;
  BLANK.items.forEach((it,ii)=>{
    if(it.t!==lastT){html+=`${lastT!==null?"</section>":""}<section class="sheet"><h2>주제 ${it.t}. ${esc(byNo(it.t).title)}</h2>`;lastT=it.t;lastH=null;}
    if(it.h!==lastH){html+=`<h3>${esc(it.h)}</h3>`;lastH=it.h;}
    num++;
    html+=`<p class="sent"><span class="num">${num}</span>`+it.parts.map((p,pi)=>{
      if(typeof p==="string")return esc(p);
      if(!it.pick.has(pi))return `<b>${esc(p.ans[0])}</b>`;
      words.push(p.ans[0]);const w=Math.max(4,p.ans[0].length*1.15+1);
      return `<input class="fill" type="text" id="f${k}" data-i="${ii}" data-p="${pi}" data-k="${k++}" style="width:${w}em" aria-label="빈칸 ${k}" autocomplete="off">`;
    }).join("")+`</p>`;
  });
  html+="</section>";
  const bankHtml=UI.blankBank?`<div class="bank"><span class="lab">보기</span> ${shuffle(words).map(w=>`<span class="kw hint" style="letter-spacing:0">${esc(w)}</span>`).join("")}</div>`:"";
  box.innerHTML=`<section class="sheet" style="position:sticky;top:0;z-index:2"><div class="row" style="justify-content:space-between"><span><b>빈칸 ${k}개</b> <span class="hint">Enter로 다음 빈칸 이동</span></span><span class="row"><button id="bg">채점하기</button><button class="ghost" id="bw" disabled>틀린 문장만 다시</button></span></div><div id="bs"></div></section>${bankHtml}${html}`;
  box.querySelectorAll("input.fill").forEach(inp=>inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const n=$("#f"+(+inp.dataset.k+1));if(n)n.focus();else $("#bg").focus();}});
  $("#bg").onclick=gradeBlank;
  $("#bw").onclick=()=>{makeBlank(true);window.scrollTo({top:0});};
}
function gradeBlank(){
  let ok=0,tot=0;const per={};
  BLANK.items.forEach(it=>it.wrong=false);
  document.querySelectorAll("#bq input.fill").forEach(inp=>{
    const it=BLANK.items[+inp.dataset.i];const p=it.parts[+inp.dataset.p];
    const good=p.ans.some(a=>norm(a)===norm(inp.value));tot++;
    per[it.t]=per[it.t]||[0,0];per[it.t][1]++;
    if(good){ok++;per[it.t][0]++;}else it.wrong=true;
    inp.classList.toggle("ok",good);inp.classList.toggle("no",!good);
    const nx=inp.nextElementSibling;if(nx&&nx.classList.contains("ans"))nx.remove();
    if(!good)inp.insertAdjacentHTML("afterend",`<span class="ans">→ ${esc(p.ans[0])}</span>`);
  });
  if(!tot)return;
  const pct=Math.round(ok/tot*100);
  if(!BLANK.graded){Object.entries(per).forEach(([t,[a,b]])=>save({m:"blank",t:+t,s:Math.round(a/b*100),lvl:UI.blankLvl||"mid"}));BLANK.graded=true;}
  const wrongN=BLANK.items.filter(i=>i.wrong).length;
  $("#bs").innerHTML=`<div class="row" style="margin-top:8px"><span class="score" style="font-size:1.6rem">${pct}%</span><span class="hint">${tot}개 중 ${ok}개 정답 · 틀린 문장 ${wrongN}개</span></div>`;
  $("#bw").disabled=!wrongN;
}

      <span id="hideBox" class="row"><span class="lab">가릴 것</span><select id="th"><option value="year">연도 가리기</option><option value="ev">사건 가리기</option><option value="mix">무작위로 섞기</option></select></span>

function tlPool(){const sel=UI.tlTopics||T.map(t=>t.no);return TL.filter(e=>sel.includes(e.t)).sort((a,b)=>a.y-b.y);}
function makeTL(){
  const pool=tlPool();const box=$("#tq");
  if(!pool.length){box.innerHTML=`<section class="sheet"><p class="hint">위에서 주제를 하나 이상 고르세요.</p></section>`;return;}
  if((UI.tlMode||"fill")==="fill")fillTL(pool,box);else orderTL(pool,box);
}
function fillTL(pool,box){
  const hide=UI.tlHide||"mix";
  const rows=pool.map((e,i)=>{let h=hide==="mix"?(Math.random()<.5?"year":"ev"):hide;if(e.approx)h="ev";return {e,h,i};});
  box.innerHTML=`<section class="sheet"><h2>백지 연표</h2><p class="hint">연도는 숫자 4자리(예: 1517), 사건은 핵심 낱말(예: 95개조 반박문)만 써도 됩니다. 연표의 흐름을 위에서 아래로 떠올리며 채우세요.</p>
  <ol class="tl">${rows.map(r=>`<li><div>${r.h==="year"?`<input type="text" inputmode="numeric" id="ty${r.i}" placeholder="연도" aria-label="연도">`:`<span class="yr">${esc(r.e.label)}</span>`}</div>
  <div>${r.h==="ev"?`<input type="text" id="te${r.i}" placeholder="무슨 일이 있었을까?" aria-label="사건">`:esc(r.e.ev)}<div class="tg">주제 ${r.e.t}</div></div></li>`).join("")}</ol>
  <div class="row" style="margin-top:14px"><button id="tg">채점하기</button><span id="ts" class="hint"></span></div></section>`;
  $("#tg").onclick=()=>{
    let ok=0;const per={};
    rows.forEach(r=>{let good,el;
      if(r.h==="year"){el=$("#ty"+r.i);const m=(el.value.match(/\d{3,4}/)||[""])[0];good=m===String(Math.floor(r.e.y));}
      else{el=$("#te"+r.i);const v=norm(el.value);good=v.length>=2&&r.e.key.some(k=>v.includes(norm(k)));}
      el.classList.add("fill");el.classList.toggle("ok",good);el.classList.toggle("no",!good);
      const nx=el.nextElementSibling;if(nx&&nx.classList.contains("ans"))nx.remove();
      if(!good)el.insertAdjacentHTML("afterend",`<div class="ans">→ ${esc(r.h==="year"?r.e.label:r.e.ev)}</div>`);
      per[r.e.t]=per[r.e.t]||[0,0];per[r.e.t][1]++;if(good){ok++;per[r.e.t][0]++;}});
    const pct=Math.round(ok/rows.length*100);
    $("#ts").innerHTML=`<b class="score" style="font-size:1.4rem">${pct}%</b> ${rows.length}개 중 ${ok}개`;
    if(!$("#tg").dataset.done){save({m:"tl",t:0,s:pct});$("#tg").dataset.done=1;}
  };
}
function orderTL(pool,box){
  // 연도가 3년 이상 차이 나고 정확한 연도가 있는 사건 중 최대 7개
  const cand=shuffle(pool.filter(e=>!e.approx));const pick=[];
  for(const e of cand){if(pick.length>=7)break;if(pick.every(p=>Math.abs(p.y-e.y)>=3))pick.push(e);}
  if(pick.length<3){box.innerHTML=`<section class="sheet"><p class="hint">순서 맞추기는 사건이 3개 이상 필요해요. 범위를 넓혀 주세요.</p></section>`;return;}
  let cur=shuffle(pick);
  const draw=(graded)=>{
    const correct=pick.slice().sort((a,b)=>a.y-b.y);
    box.innerHTML=`<section class="sheet"><h2>사건 순서 맞추기</h2><p class="hint">▲▼ 버튼으로 먼저 일어난 사건이 위로 오게 정렬하세요.</p>
    <ol class="ord">${cur.map((e,i)=>{const st=graded?(correct[i]===e?"ok":"no"):"";return `<li class="${st}"><span class="t">${esc(e.ev)}${graded?` <b class="tg">(${esc(e.label)})</b>`:""}</span><button class="ghost small" data-u="${i}" aria-label="위로" ${i===0||graded?"disabled":""}>▲</button><button class="ghost small" data-d="${i}" aria-label="아래로" ${i===cur.length-1||graded?"disabled":""}>▼</button></li>`}).join("")}</ol>
    <div class="row" style="margin-top:14px">${graded?`<button id="again">새 문제</button>`:`<button id="og">채점하기</button>`}<span id="os" class="hint"></span></div></section>`;
    box.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const i=+b.dataset.u;[cur[i-1],cur[i]]=[cur[i],cur[i-1]];draw(false);});
    box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const i=+b.dataset.d;[cur[i+1],cur[i]]=[cur[i],cur[i+1]];draw(false);});
    if(graded){const ok=cur.filter((e,i)=>correct[i]===e).length;$("#os").innerHTML=`<b>${cur.length}개 중 ${ok}개 제자리</b> · 초록은 맞은 자리, 빨강은 틀린 자리`;$("#again").onclick=makeTL;save({m:"order",t:0,s:Math.round(ok/cur.length*100)});}
    else $("#og").onclick=()=>draw(true);
  };
  draw(false);
}

  <section class="sheet"><div class="row" style="justify-content:space-between"><span class="hint">총 ${h.length}개의 기록 · 이 브라우저에만 저장</span><button class="ghost small" id="reset">기록 모두 지우기</button></div></section>`;
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{UI.recallTopic=+b.dataset.go;saveUI();location.hash="recall";});
  $("#reset").onclick=async()=>{if(await ask("모든 학습 기록을 지울까요? 되돌릴 수 없어요.")){clearAll();viewRecord();}};
}

const VIEWS={recall:viewRecall,blank:viewBlank,timeline:viewTimeline,record:viewRecord,guide:viewGuide};
